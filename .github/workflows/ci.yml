# All actions are pinned to full commit SHAs and all Python dependencies are
# installed with pip's hash-checking mode (--require-hashes) from
# requirements/ci.lock, so CI runs only supply-chain-verified code.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install pinned tools
        run: python -m pip install --require-hashes -r requirements/ci.lock
      - name: Lint
        run: ruff check --output-format=github .
      - name: Format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned test dependencies
        run: python -m pip install --require-hashes -r requirements/ci.lock
      # The package is exercised from the source tree (pytest pythonpath),
      # so no unpinned build backend ever gets installed in CI.
      - name: Run tests
        run: python -m pytest --cov --cov-report=term --cov-fail-under=85

  # Functional end-to-end check: the real MediaPipe models process a real
  # (hash-verified) photo through the full pipeline to real UDP outputs, and
  # the result is compared against the committed golden sample.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: |
          python -m pip install --require-hashes -r requirements/ci.lock
          python -m pip install --require-hashes -r requirements/runtime.lock
      - name: Fetch models and test assets (sha256-verified)
        run: |
          python tools/fetch_models.py
          python tools/fetch_test_assets.py
      - name: Run e2e tests
        run: python -m pytest -m e2e --no-cov

  # Container image: build (digest-pinned base, hash-checked deps, verified
  # models baked in) and smoke-test the entrypoint headlessly.
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t easyfbt:ci .
      - name: Smoke test entrypoint
        run: docker run --rm easyfbt:ci --version
      - name: Smoke test imports and baked-in assets
        run: |
          docker run --rm --entrypoint python easyfbt:ci -c "
          import pathlib
          import cv2, mediapipe, numpy
          import easyfbt
          from easyfbt.config import load_config
          cfg = load_config('/config/config.toml')
          for m in (cfg.models.pose_model, cfg.models.face_model):
              assert pathlib.Path(m).is_file(), m
          print('easyfbt', easyfbt.__version__, 'image OK')
          "
